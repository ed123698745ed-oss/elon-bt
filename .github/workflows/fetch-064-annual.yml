name: fetch-064-annual
# 064 年報附表三試抓（114 年度）。D-064-20261109-2350-1；Ed 2026-11-09 23:59 授權。
# 原始 PDF 每次執行打包成一個分片上傳 Release「raw-064-annual」（未驗收，非共用資料層）；進度存 state064.tar.gz。
on:
  push:
    paths: ["experiments/064/**"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
concurrency: { group: fetch-064-annual, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ROC_YEAR: "114"
      INTERVAL: "20"
      BUDGET_MIN: "320"
      MAX_DONE: "500"
      OUT: out064
      STATE: state064
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pypdfium2
      - name: restore progress
        run: |
          gh release view raw-064-annual >/dev/null 2>&1 || gh release create raw-064-annual --title raw-064-annual --notes "064 年報附表三試抓原始檔（未驗收，非共用資料層）；分片 pdf-part-*.tar.gz；進度 state064.tar.gz" --prerelease
          gh release download raw-064-annual -p state064.tar.gz || true
          if [ -f state064.tar.gz ]; then tar xzf state064.tar.gz; else mkdir -p state064; echo "BUDGET_MIN=12" >> $GITHUB_ENV; echo "首次執行：只跑 12 分鐘驗證流程"; fi
          if python -c "import json,sys;p=json.load(open('state064/progress.json'));sys.exit(0 if p.get('remaining',1)==0 or p.get('blocked_runs',0)>=3 else 1)" 2>/dev/null; then echo "SKIP=1" >> $GITHUB_ENV; echo "已完成或已停止"; fi
      - name: fetch
        if: env.SKIP != '1'
        run: python experiments/064/fetch_annual.py || echo "EXIT=$?" >> $GITHUB_ENV
      - name: save
        if: always() && env.SKIP != '1'
        run: |
          RUN=$(date -u +%Y%m%dT%H%M)
          tar czf state064.tar.gz state064
          if [ -n "$(ls out064 2>/dev/null)" ]; then
            tar czf pdf-part-$RUN.tar.gz out064
            sha256sum pdf-part-$RUN.tar.gz > pdf-part-$RUN.sha256
            gh release upload raw-064-annual pdf-part-$RUN.tar.gz pdf-part-$RUN.sha256 --clobber
          fi
          gh release upload raw-064-annual state064.tar.gz state064/progress.json --clobber
          echo "exit=${EXIT:-0}"
      - name: chain next run
        # GitHub 排程常延遲數小時；未完成、未被擋時，結束後直接接續下一輪（仍是單一序列、間隔不變）
        if: always() && env.SKIP != '1' && env.EXIT != '2'
        run: |
          left=$(python -c "import json;print(json.load(open('state064/progress.json')).get('remaining',1))")
          blk=$(python -c "import json;print(json.load(open('state064/progress.json')).get('blocked_runs',0))")
          echo "remaining=$left blocked_runs=$blk"
          if [ "$left" != "0" ] && [ "$blk" -lt 3 ]; then gh workflow run fetch-064-annual.yml --ref main; fi
