name: build-data
# 由 raw-progress 原始資料建置資料層並發佈 Release data-YYYYMMDD（push jobs/build.txt 觸發）
on:
  push:
    paths: ["jobs/build.txt"]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas pyarrow numpy scipy pytest tabulate
      - name: get raw
        run: |
          gh release download raw-progress -p raw-progress.tar.gz
          tar xzf raw-progress.tar.gz
          # 退回-67：逐日市場別、櫃買歷史除權息、官方減資表（fetch-market）
          for s in tpex tpex_stock twse; do gh release download raw-market -p market-$s.tar.gz && tar xzf market-$s.tar.gz || echo "缺 market-$s"; done
          tar czf raw-all.tar.gz raw
          sha256sum raw-progress.tar.gz market-*.tar.gz raw-all.tar.gz | tee raw_sha256.txt
      - name: build
        run: RAW_DIR=raw OUT_DIR=out python data_layer/build.py
      - name: tests (data layer)
        run: |
          set +e
          ELON_OUT=out BT_STATS_PATH=none python -m pytest -q -rA tests/ > out/test_output.txt 2>&1
          echo "TEST_RC=$?" >> $GITHUB_ENV
          tail -30 out/test_output.txt
      - name: publish
        run: |
          # 標籤由 jobs/build.txt 的 tag= 指定；已存在就停止（不覆蓋、不刪除舊版，例如 data-20261105 須保留供對照）
          export TAG=$(grep -o 'tag=[A-Za-z0-9._-]*' jobs/build.txt | tail -1 | cut -d= -f2)
          [ -z "$TAG" ] && export TAG=data-$(TZ=Asia/Taipei date +%Y%m%d%H%M)
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG 已存在，停止"; exit 1; fi
          python - <<'P'
          import json,hashlib,os,subprocess
          m=json.load(open('out/manifest.json'))
          m['raw_package']={'asset':'raw.tar.gz','sha256':hashlib.sha256(open('raw-all.tar.gz','rb').read()).hexdigest(),
                            'parts':open('raw_sha256.txt').read().split('\n')}
          m['code_commit']=os.environ['GITHUB_SHA']; m['data_tag']=os.environ.get('TAG','')
          m['tests_exit_code']=int(os.environ.get('TEST_RC','-1'))
          json.dump(m,open('out/manifest.json','w'),ensure_ascii=False,indent=1)
          P
          mv raw-all.tar.gz out/raw.tar.gz
          gh release create "$TAG" --title "$TAG 第一期資料層" --notes "清冊 manifest.json；建置日誌 build_log.json；測試輸出 test_output.txt（結束碼見 manifest.tests_exit_code）；原始資料 raw.tar.gz；程式版本見 manifest.code_commit" out/*
